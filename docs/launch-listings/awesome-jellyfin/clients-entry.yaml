# Insert into assets/clients/clients.yaml on the `main` branch of
# github.com/awesome-jellyfin/awesome-jellyfin — NOT CLIENTS.md (auto-generated).
# Add in ALPHABETICAL order (a sort-check bot, `/sort-check -fix`, flags out-of-order PRs).
# Schema verified 2026-06-22 against assets/clients/README.md:
#   - `types: [Music]` puts it in the Music Client section (section: true) — like Finamp / Tauon.
#   - the `github` download type takes SEPARATE `owner:` + `repo:` keys (NOT "owner/repo").
#   - there is no winget/microsoft-store/pypi download type; the recognized shield icon
#     "Microsoft Store" exists (used by other clients) — use `shield` for it, `text` for PyPI.
#   - OMIT `official` (it defaults to non-official when `oss` is outside the jellyfin org).
#   - do NOT add a flathub download — jellytoast ships no Flatpak.
# Commit with a Conventional Commit, e.g. `feat(clients): add jellytoast`.
  - name: jellytoast
    targets: [Windows, Linux]
    types: [Music]
    oss: https://github.com/wolfgangwarehaus/jellytoast
    website: https://wolfgangwarehaus.com/jellytoast
    price:
      free: true
    downloads:
      - type: github
        owner: wolfgangwarehaus
        repo: jellytoast
      - type: shield
        icon: "Microsoft Store"
        label: Microsoft Store
        url: https://apps.microsoft.com/detail/9PNLTPXGHN79
      - type: text
        text: "PyPI (pipx)"
        url: https://pypi.org/project/jellytoast/
