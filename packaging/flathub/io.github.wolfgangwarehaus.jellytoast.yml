# Flathub submission manifest for jellytoast.
#
# Derived from the working self-distributed CI manifest
# (packaging/flatpak/io.github.wolfgangwarehaus.jellytoast.yml) with the
# one change Flathub requires: NO network during build. Every Python
# dependency is a declared source (exact wheel/sdist URL + sha256,
# resolved for the runtime's Python 3.13 on x86_64 + aarch64) and pip
# runs with --no-index against the local download dir. jellytoast itself
# builds from the v0.2.1 release tarball, hash-pinned, with
# external-data-checker metadata so new tags open update PRs
# automatically once the app is on Flathub.
#
# Load-bearing invariants carried over from the CI manifest — do not
# "simplify" these away:
#   * PySide6 comes from io.qt.PySide.BaseApp (built against the
#     runtime's Qt) and must NEVER be pip-installed: the PyPI wheel
#     bundles its own Qt with the same SONAMEs, KF6 WindowSystem then
#     binds the wrong libQt6, the Wayland native interface mismatches,
#     and the KWin blur silently no-ops while reporting ACTIVE
#     (issue #229). Hence: deps installed explicitly, jellytoast
#     installed with --no-deps.
#   * ffmpeg is built --enable-gnutls: without a TLS backend FFmpeg
#     silently drops the https protocol and every TLS media URL fails
#     as `loading failed` (0.2.0 Steam Deck QA).
#   * --talk-name=org.kde.KWin: read-only blur-honesty D-Bus check so
#     the app can tell whether KWin's Blur effect is actually on.
#
# Regenerating the Python sources after a dependency change: see
# packaging/flathub/README.md ("Regenerating the pinned Python sources").

app-id: io.github.wolfgangwarehaus.jellytoast
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
# PySide6 prebuilt against the runtime's Qt — ONE Qt in the process, so
# KF6 WindowSystem binds the same Qt and the ctypes blur backend
# (jellytoast/blur/_kwin.py) finds a compatible library.
base: io.qt.PySide.BaseApp
base-version: '6.10'
command: jellytoast

build-options:
  env:
    # jellytoast imports no QtWebEngine — let the BaseApp cleanup script
    # drop the whole web stack (~300 MB installed).
    BASEAPP_REMOVE_WEBENGINE: '1'

# Required by the BaseApp: strips PySide6 dev tools / docs and (with the
# env above) QtWebEngine. NB: do NOT also set BASEAPP_DISABLE_NUMPY —
# the app needs numpy (visualizer FFT) and deliberately uses the
# BaseApp's copy instead of pip-installing its own (same site-packages
# prefix; two copies would just shadow each other).
cleanup-commands:
  - /app/cleanup-BaseApp.sh

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network            # the media server + casting live on the network
  - --socket=pulseaudio        # PipeWire's pulse interface on modern distros
  - --device=dri               # GPU for Qt RHI + mpv vo=gpu
  - --own-name=org.mpris.MediaPlayer2.jellytoast   # media keys / MPRIS
  - --talk-name=org.freedesktop.Notifications      # track-change toasts
  - --talk-name=org.kde.StatusNotifierWatcher      # tray icon
  - --talk-name=org.freedesktop.secrets            # keyring (server login)
  # Blur HONESTY check (read-only queries: isEffectLoaded / compositing
  # active). KWin's Wayland blur protocol stays advertised even when the
  # Blur desktop effect is OFF, so without this grant the sandbox can't
  # tell, trusts the capability bit, and paints full-transparency glass
  # over an UNBLURRED desktop (0.2.0 Steam Deck report). With it,
  # blur/_kwin.py's D-Bus cross-check works and the app demotes to the
  # near-opaque frosted fallback.
  - --talk-name=org.kde.KWin
  # NOTE — deliberately absent vs the self-distributed manifest:
  # --filesystem=~/.config/autostart:create. The Flathub linter rejects
  # it (finish-args-autostart-filesystem-access); until the app migrates
  # launch-at-login to the Background/Autostart portal, the toggle
  # degrades gracefully (autostart/_linux.py enable() returns False on
  # the denied write) — the feature is simply unavailable on Flathub.

modules:
  - name: libass
    buildsystem: meson
    config-opts: [-Ddefault_library=shared]
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz
        sha256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959

  - name: ffmpeg-lgpl
    buildsystem: autotools
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-gpl
      - --disable-nonfree
      - --disable-programs
      - --disable-doc
      - --disable-postproc
      - --disable-avdevice
      - --disable-encoders
      - --disable-muxers
      # TLS backend — see header. gnutls is the GPL-compatible choice
      # (OpenSSL's Apache-2.0 is not, for this project's GPL-2.0+); the
      # KDE runtime ships libgnutls, the SDK the headers.
      - --enable-gnutls
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        tag: n7.1
        commit: b08d7969c550a804a59511c7b83f2dd8cc0499b8

  - name: libplacebo
    # mpv >=0.37 hard-requires libplacebo at build even for audio. This
    # is a music player — it never uses libplacebo's GPU video renderer —
    # so vulkan is off (its bundled Vulkan-Headers wrap's codegen doesn't
    # resolve under the KDE SDK, and we'd never exercise it anyway).
    buildsystem: meson
    config-opts:
      - -Ddemos=false
      - -Dvulkan=disabled
      - -Dd3d11=disabled
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.349.0
        commit: 1fd3c7bde7b943fe8985c893310b5269a09b46c5

  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dgpl=false
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dvapoursynth=disabled
      - -Ddefault_library=shared
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.39.0
        commit: a0fba7be57f3822d967b04f0f6b6d6341e7516e7

  - name: extra-cmake-modules
    buildsystem: cmake-ninja
    config-opts: [-DBUILD_TESTING=OFF]
    cleanup: ['*']
    sources:
      - type: git
        url: https://invent.kde.org/frameworks/extra-cmake-modules.git
        tag: v6.27.0
        commit: fa262097a48f0f84529498741afcc7040e93b271

  - name: kwindowsystem
    # Supplies libKF6WindowSystem.so.6 for the ctypes blur backend —
    # true KWin blur instead of faux frost inside the sandbox.
    buildsystem: cmake-ninja
    config-opts: [-DBUILD_TESTING=OFF]
    sources:
      - type: git
        url: https://invent.kde.org/frameworks/kwindowsystem.git
        tag: v6.27.0
        commit: 97aadfe443fcd097d78f9926d4c0fb8c52011727

  - name: python3-dependencies
    # Offline mirror of jellytoast's runtime Python deps (everything in
    # pyproject's [project].dependencies with a linux-true marker EXCEPT
    # PySide6 — see header — and numpy, which the BaseApp provides).
    # Pinned by resolving with the runtime's own pip/Python 3.13, then
    # wheel URLs+hashes selected for cp313 x86_64 + aarch64 via
    # req2flatpak. Regeneration steps: packaging/flathub/README.md.
    #
    # Two pip invocations, deliberately: miniaudio (pyatv dep) ships no
    # linux-aarch64 wheel, so on aarch64 it builds from the sdist under
    # --no-build-isolation, which needs cffi ALREADY importable — so
    # cffi (+pycparser) install first.
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-build-isolation cffi pycparser
      - pip3 install --verbose --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-build-isolation aiohappyeyeballs aiohttp
        aiosignal annotated-types appdirs async_upnp_client attrs casttube
        certifi chacha20poly1305-reuseable charset-normalizer cryptography
        dbus-next defusedxml frozenlist idna ifaddr jaraco.classes
        jaraco.context jaraco.functools jeepney keyring lxml miniaudio
        more-itertools multidict propcache protobuf pyatv PyChromecast
        pydantic pydantic_core python-didl-lite python-mpv python-xlib
        requests SecretStorage six soco srptools tabulate tinytag
        typing-inspection typing_extensions urllib3 voluptuous xmltodict
        yarl zeroconf
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/71/43/1947f06babed6b3f1d7f38b0c767f52df66bfb2bc10b468c4a7de9eceff2/aiohappyeyeballs-2.7.1-py3-none-any.whl
