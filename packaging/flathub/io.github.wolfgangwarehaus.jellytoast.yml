  - name: jellytoast
    buildsystem: simple
    build-commands:
      # Drift guard: every linux-relevant dependency from pyproject must
      # already be installed (by the offline module above, the BaseApp,
      # or the runtime). Fails the build loudly if a new dep lands in
      # pyproject without the pinned sources being regenerated.
      - |
        python3 - <<'PY'
        import re, tomllib, importlib.metadata as md
        deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
        missing = []
        for dep in deps:
            req, _, marker = dep.partition(";")
            if marker and ("win32" in marker or "darwin" in marker) and "!=" not in marker:
                continue  # windows/macos-only dep
            name = re.match(r"\s*([A-Za-z0-9._-]+)", req).group(1)
            try:
                md.distribution(name)
            except md.PackageNotFoundError:
                missing.append(name)
        assert not missing, (
            f"deps missing from the offline set: {missing} — regenerate "
            "the python3-dependencies sources (packaging/flathub/README.md)"
        )
        PY
      # --no-deps: PySide6 must stay the BaseApp's build (see header);
      # everything else is already installed by python3-dependencies.
      - pip3 install --no-index --no-build-isolation --prefix=${FLATPAK_DEST}
        --no-deps .
      - install -Dm755 launcher.sh /app/bin/jellytoast
      - install -Dm644 packaging/io.github.wolfgangwarehaus.jellytoast.desktop
        /app/share/applications/io.github.wolfgangwarehaus.jellytoast.desktop
      # Metainfo comes from the file checked into the Flathub app repo,
      # NOT the tarball: the v0.2.1 tarball's copy references four
      # since-removed screenshot URLs (radio/downloads/settings/
      # mini-compact, all 404) and Flathub's screenshot mirroring would
      # trip over them. Drop this override (and the file source below)
      # once a release >= 0.2.2 ships the fixed metainfo in-tree.
      - install -Dm644 metainfo-override.xml
        /app/share/metainfo/io.github.wolfgangwarehaus.jellytoast.metainfo.xml
      - |
        for sz in 16 24 32 48 64 128 256 512; do
          f="packaging/icons/hicolor/${sz}x${sz}/apps/io.github.wolfgangwarehaus.jellytoast.png"
          if [ -f "$f" ]; then
            install -Dm644 "$f" \
              "/app/share/icons/hicolor/${sz}x${sz}/apps/io.github.wolfgangwarehaus.jellytoast.png"
          fi
        done
      - install -Dm644 packaging/icons/jellytoast.svg
        /app/share/icons/hicolor/scalable/apps/io.github.wolfgangwarehaus.jellytoast.svg
    sources:
      - type: archive
        url: https://github.com/wolfgangwarehaus/jellytoast/archive/refs/tags/v0.2.1.tar.gz
        sha256: caae1a6d624fb98760f050e2988ffd3326a4491aa08241ef25d6b3c203b5bb78
        # flathub/flatpak-external-data-checker: opens an update PR on
        # the app's Flathub repo when a new GitHub release tag appears.
        # NB: it bumps only this source — the pinned Python sources above
        # must be regenerated manually when pyproject deps change.
        x-checker-data:
          type: json
          url: https://api.github.com/repos/wolfgangwarehaus/jellytoast/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/wolfgangwarehaus/jellytoast/archive/refs/tags/" + .tag_name + ".tar.gz"'
      - type: file
        path: io.github.wolfgangwarehaus.jellytoast.metainfo.xml
        dest-filename: metainfo-override.xml
      - type: script
        dest-filename: launcher.sh
        commands:
          # Prefer native Wayland with an xcb fallback — same policy as
          # dev/run.sh; without it Qt tries xcb first inside the sandbox.
          - export QT_QPA_PLATFORM="${QT_QPA_PLATFORM:-wayland;xcb}"
          - exec python3 -m jellytoast "$@"
