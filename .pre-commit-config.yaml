# pre-commit hooks for jellytoast.
#
# Lint-only by design: ruff check --fix (E + F + I). The lint config
# lives in pyproject.toml under [tool.ruff.lint] — DON'T duplicate rules
# here. The `I` rule keeps imports sorted + auto-fixed on commit, which
# is what kept biting us as the recurring F401 backlog.
#
# NOTE: `ruff-format` is deliberately NOT enabled. jellytoast wraps by
# editorial judgment (E501 is off, formatting is self-imposed, not
# enforced — see pyproject.toml). Turning on ruff-format would
# Black-reformat the whole tree against that policy.
#
# Enable locally with:
#     pip install pre-commit && pre-commit install   (or: pacman -S pre-commit)
#
# Run ad-hoc against the whole tree:
#     pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
