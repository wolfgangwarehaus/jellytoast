# Project metadata for jellytoast.
#
# Flat layout: `modules/` package tree + `jellytoast.py` entry script
# both at repo root. setuptools picks the entry script up via
# `[tool.setuptools] py-modules`, and the packages via
# `[tool.setuptools.packages.find]`. The src/ migration can happen later
# as its own effort; flat keeps `python jellytoast.py` working for the
# dev launch path while also producing a pip-installable wheel.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jellytoast"
version = "0.1.0"
description = "Audio-first native Jellyfin / Subsonic desktop client for Linux with bit-perfect mpv playback."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
authors = [
    { name = "august", email = "augustvontrips@gmail.com" },
]
keywords = ["jellyfin", "media", "music", "mpv", "linux", "kde"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Multimedia :: Video :: Display",
]

# Cap policy: we put a GENEROUS upper bound only on deps whose major
# bump would plausibly break us — either because we drive a private API
# (pyatv) or because a major Qt/binding rev is a known compat cliff
# (PySide6, pychromecast). Stable, narrow-surface deps (requests,
# zeroconf, keyring, cryptography) stay open-ended; over-pinning them
# just creates needless resolver friction on a clean install.
dependencies = [
    # Cap at the next major: Qt 7 is a hard compat break and must never
    # silently install over the user's working 6.x. The floor stays at
    # 6.6.0 (earliest API we rely on); installed today is 6.11.x.
    "PySide6>=6.6.0,<7.0",
    "python-mpv>=1.0.5",
    "pychromecast>=14.0.0,<16",
    "zeroconf>=0.80.0",
    # ifaddr enumerates local interfaces so Chromecast mDNS discovery can
    # bind to the LAN and exclude a Tailscale/CGNAT overlay (a default
    # all-interface bind sends the query out the tunnel and finds nothing
    # — modules/cast_manager._discovery_interfaces). It's already pulled
    # in transitively by zeroconf, but we import it directly now, so
    # declare it. Falls back gracefully (default binding) if absent.
    "ifaddr>=0.1.7",
    # dbus-next is a Linux-only feature dep (MPRIS / freedesktop). The
    # platform marker keeps `pip install` clean on Windows / macOS.
    'dbus-next>=0.2.3 ; sys_platform == "linux"',
    # pyatv (AirPlay 2) is broken on Windows — relies on asyncio +
    # low-level network primitives that don't ship there. macOS / Linux
    # only.
    # pyatv>=0.17 ships the modern API the LG-webOS compat shim assumes
    # (per docs/research/airplay2.md). Older 0.14.x is broken for our use.
    # Upper-capped at <1.0: modules/airplay2.py drives the PRIVATE
    # `pyatv.support.rtsp.RtspSession` API (the LG /setProperty + /rate
    # error-tolerance patch), which has no stability guarantee — a 1.x
    # major could rename or restructure it out from under us. Installed
    # today is 0.17.0.
    'pyatv>=0.17,<1.0 ; sys_platform != "win32"',
    # python-xlib backs the KDE startup-notification cursor cleanup
    # (jellytoast.py _finish_startup_notification → `from Xlib import …`).
    # Linux-only and gracefully optional — the import is wrapped in a
    # try/except behind an IS_LINUX guard, so a missing binding just
    # leaves the bouncing-cursor cleanup as a no-op. Declared here so a
    # clean install actually ships it instead of silently degrading.
    'python-xlib>=0.30 ; sys_platform == "linux"',
    "requests>=2.28.0",
    "keyring>=23.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",
    # Randomises test order every run (a fresh seed each CI run, printed
    # in the header so a failure reproduces via `pytest
    # --randomly-seed=N`). Guards against the order-dependent state leaks
    # we've chased: QSettings-singleton divergence, the snapcast SIGSEGV
    # (Bug 2), the visualizer worker-stop race, async_io shutdown noise,
    # the single_instance pump, and the cast/async leak cluster (cast
    # discovery loop threads, the SettingsDialog auto-probe, smart-playlist
    # preview dispatch). All isolated as of 2026-05-30.
    "pytest-randomly>=3.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
]
# Visualizer FFT backend. Lazy-imported by modules/visualizer.py — the
# subsystem only spins up when JT_VISUALIZER=1, so numpy is opt-in to
# keep the default install (and the Flatpak bundle) lean.
visualizer = ["numpy>=1.24"]
# DLNA / UPnP-AV cast backend (modules/cast/dlna.py). Soft-imported via
# _ensure_async_upnp() so the module is safe to load without the dep
# installed; discovery short-circuits to "no DLNA renderers" when
# async-upnp-client is missing. Disabled by default in Settings
# (cast/dlna_enabled).
dlna = ["async-upnp-client>=0.47.0,<1.0"]
# Native Sonos cast backend (modules/cast/sonos.py). Lazy-imports soco
# via _ensure_soco(); discovery silently no-ops when missing. Disabled
# by default in Settings (cast/sonos_enabled).
sonos = ["soco>=0.31,<1"]
# Snapcast control surface (modules/cast/snapcast.py). Lazy-imports
# the asyncio JSON-RPC client via _ensure_snapcast(); discovery silently
# no-ops when missing. Disabled by default in Settings
# (cast/snapcast_enabled).
snapcast = ["snapcast>=2.3.8"]
# Per-platform extras. Empty for now; populated when we add Windows
# (SMTC via winrt, autostart via registry) and macOS (NowPlaying /
# LaunchAgent via pyobjc) backends.
windows = []
macos = []

# GUI entry point. `gui-scripts` (vs `scripts`) suppresses the console
# window on Windows; on Linux it behaves identically to `scripts`. The
# planned AUR PKGBUILD and Flatpak manifest will invoke this entry point
# (neither exists in the repo yet — packaging is scaffolded but deferred).
[project.gui-scripts]
jellytoast = "jellytoast:main"

[tool.setuptools]
# Flat layout: the top-level launcher is a single .py file, the rest of
# the code lives in the `modules` package tree.
py-modules = ["jellytoast"]

[tool.setuptools.packages.find]
include = ["modules*"]
exclude = ["tests*", "docs*", "packaging*"]

[tool.setuptools.package-data]
# The drag-repaint KWin scripted effect ships as data files (JSON + JS)
# inside the modules.drag_repaint package — installed into the user's
# KWin effects dir at runtime by modules/drag_repaint/_kwin.py.
"modules.drag_repaint" = [
    "effect/jellytoast_dragrepaint/metadata.json",
    "effect/jellytoast_dragrepaint/contents/code/main.js",
]
# The brand-mark SVG lives in-package so it ships in the built wheel —
# modules/ui_helpers.make_app_icon() loads it via importlib.resources.
# (The packaging/icons/ copy stays for the freedesktop / hicolor system
# install, which is outside the wheel.)
"modules.assets" = ["*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Quiet noisy DeprecationWarnings from PySide6 / requests during test runs;
# they're not regressions in our code.
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Default ruleset is small + sane: pyflakes (F) catches real bugs,
# pycodestyle errors (E) catch the mechanical ones, isort (I) keeps
# import order deterministic + auto-fixable. Style warnings (W) and
# formatting nits stay off — Black-style formatting is self-imposed,
# not enforced.
select = ["E", "F", "I"]
ignore = [
    # Lazy module-level imports (after a helper function) are an
    # intentional pattern in a few modules. Real "imports buried mid-
    # function" should still be reviewed but ruff can't tell them
    # apart from the legitimate ones, so the rule's off globally.
    "E402",
    # Line-length nag; we wrap by editorial judgment.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# The MPRIS backend uses dbus-next's compact type-string annotations
# ("b" = bool, "s" = string, "as" = string array, "a{sv}" = dict).
# These look like syntax errors / undefined names to ruff but are
# the documented dbus-next API for declaring D-Bus property types.
"modules/media_controls/_mpris.py" = ["F821", "F722"]
