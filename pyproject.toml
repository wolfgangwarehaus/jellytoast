# Project metadata for jellytoast.
#
# Flat layout: one `jellytoast/` package at repo root holding everything
# (the app entry lives at jellytoast/app.py; `python -m jellytoast` runs
# it). setuptools picks the package up via
# `[tool.setuptools.packages.find]`. Flat (vs src/) keeps the no-install
# dev launch path working from a checkout while producing a
# pip-installable wheel with a single, properly-namespaced package.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jellytoast"
version = "0.1.7"
description = "A desktop music player for Jellyfin and Navidrome servers — bit-perfect mpv playback (Linux + Windows)."
readme = "README.md"
# Floor is 3.11, not 3.10: the pinned pychromecast (>=14) requires
# Python >=3.11, so a 3.10 install can't even resolve dependencies. The
# old ">=3.10" was fictional — surfaced by the CI 3.10 matrix leg.
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
authors = [
    { name = "august", email = "august@wolfgangwarehaus.com" },
]
keywords = ["jellyfin", "navidrome", "subsonic", "media", "music", "mpv", "linux", "windows", "kde"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]

# Cap policy: we put a GENEROUS upper bound only on deps whose major
# bump would plausibly break us — either because we drive a private API
# (pyatv) or because a major Qt/binding rev is a known compat cliff
# (PySide6, pychromecast). Stable, narrow-surface deps (requests,
# zeroconf, keyring, cryptography) stay open-ended; over-pinning them
# just creates needless resolver friction on a clean install.
dependencies = [
    # Cap at the next major: Qt 7 is a hard compat break and must never
    # silently install over the user's working 6.x. The floor stays at
    # 6.6.0 (earliest API we rely on); installed today is 6.11.x.
    "PySide6>=6.6.0,<7.0",
    "python-mpv>=1.0.5",
    "pychromecast>=14.0.0,<16",
    # Security floor: bumped to 0.149.12 to clear CVE-2026-47180/47183/
    # 47184/48045 (pip-audit gate). 0.149.x is resolver-compatible —
    # pychromecast only needs zeroconf>=0.25.1. Open-ended above per the
    # policy note. NB: zeroconf underpins Chromecast/DLNA discovery, so a
    # real upgrade past the currently-installed build wants a discovery
    # re-verify on hardware (the floor bump stays within 0.149.x patch).
    "zeroconf>=0.149.12",
    # ifaddr enumerates local interfaces so Chromecast mDNS discovery can
    # bind to the LAN and exclude a Tailscale/CGNAT overlay (a default
    # all-interface bind sends the query out the tunnel and finds nothing
    # — jellytoast/cast_manager._discovery_interfaces). It's already pulled
    # in transitively by zeroconf, but we import it directly now, so
    # declare it. Falls back gracefully (default binding) if absent.
    "ifaddr>=0.1.7",
    # dbus-next is a Linux-only feature dep (MPRIS / freedesktop). The
    # platform marker keeps `pip install` clean on Windows / macOS.
    'dbus-next>=0.2.3 ; sys_platform == "linux"',
    # jeepney is imported directly (color_picker.py portal PickColor) —
    # declared so the import doesn't rely on keyring's transitive pin.
    # Linux-only.
    'jeepney>=0.6 ; sys_platform == "linux"',
    # pyatv (AirPlay 2) is broken on Windows — relies on asyncio +
    # low-level network primitives that don't ship there. macOS / Linux
    # only.
    # pyatv>=0.17 ships the modern API the LG-webOS compat shim assumes
    # (per docs/research/airplay2.md). Older 0.14.x is broken for our use.
    # Upper-capped at <1.0: jellytoast/airplay2.py drives the PRIVATE
    # `pyatv.support.rtsp.RtspSession` API (the LG /setProperty + /rate
    # error-tolerance patch), which has no stability guarantee — a 1.x
    # major could rename or restructure it out from under us. Installed
    # today is 0.17.0.
    'pyatv>=0.17,<1.0 ; sys_platform != "win32"',
    # python-xlib backs the KDE startup-notification cursor cleanup
    # (jellytoast/app.py _finish_startup_notification → `from Xlib import …`).
    # Linux-only and gracefully optional — the import is wrapped in a
    # try/except behind an IS_LINUX guard, so a missing binding just
    # leaves the bouncing-cursor cleanup as a no-op. Declared here so a
    # clean install actually ships it instead of silently degrading.
    'python-xlib>=0.30 ; sys_platform == "linux"',
    # Security floor: 2.32.4 patches CVE-2024-47081 (.netrc credential
    # leak) and the earlier CVE-2024-35195 verify-bypass.
    "requests>=2.32.4",
    "keyring>=23.0",
    # Security floor: 43.0.1 is a current patched OpenSSL-backed release
    # (clears the GHSA-h4gh-qq45 / pyOpenSSL-side advisories that lingered
    # on the old >=41.0 floor). Narrow surface, so no upper cap.
    "cryptography>=43.0.1",
    # ── Cast / visualizer backends ────────────────────────────────────
    # Promoted from per-feature extras to required deps so EVERY install
    # (pipx, source, future AUR) ships the same backend set — no
    # more "DLNA missing on the pipx box". All cross-platform + small. Each
    # is still soft-imported behind an _ensure_* / is_available() guard and
    # gated by its Settings toggle, so a feature only runs when the user
    # enables it; bundling just guarantees the dependency is present.
    "numpy>=1.24",  # visualizer FFT (spins up in the visualizer now-playing mode)
    "async-upnp-client>=0.47.0,<1.0",  # DLNA / UPnP-AV cast backend
    # Security floor: aiohttp is pulled transitively by async-upnp-client;
    # <3.14.0 carries CVE-2026-34993 (CookieJar.load RCE) + CVE-2026-47265
    # (cross-origin cookie leak). Declared directly to pin the floor.
    "aiohttp>=3.14.0",
    "soco>=0.31,<1",  # native Sonos cast backend
    # Windows-only WinRT projections for System Media Transport Controls
    # (media flyout + hardware media keys) and now-playing toasts. The
    # per-namespace winrt-* packages are the maintained PyWinRT path;
    # imports are lazy + guarded so a missing/old projection degrades to a
    # no-op rather than breaking boot. (jellytoast/media_controls/_windows.py)
    'winrt-runtime>=2.0 ; sys_platform == "win32"',
    'winrt-Windows.ApplicationModel>=2.0 ; sys_platform == "win32"',
    'winrt-Windows.Media>=2.0 ; sys_platform == "win32"',
    'winrt-Windows.Media.Interop>=2.0 ; sys_platform == "win32"',
    'winrt-Windows.Storage.Streams>=2.0 ; sys_platform == "win32"',
    'winrt-Windows.Foundation>=2.0 ; sys_platform == "win32"',
    # Windows toast notifications (download-complete + opt-in now-playing).
    # Maintained WinRT ToastNotificationManager wrapper; guarded so a
    # missing install just disables toasts. (jellytoast/notifications/_windows.py)
    'windows-toasts>=1.1 ; sys_platform == "win32"',
    # comtypes drives ITaskbarList3 for the taskbar overlay badge (Qt6
    # dropped QtWinExtras). Guarded so a missing install just disables the
    # badge. (jellytoast/taskbar.py)
    'comtypes>=1.2 ; sys_platform == "win32"',
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",
    # Randomises test order every run (a fresh seed each CI run, printed
    # in the header so a failure reproduces via `pytest
    # --randomly-seed=N`). Guards against the order-dependent state leaks
    # we've chased: QSettings-singleton divergence, the visualizer
    # worker-stop race, async_io shutdown noise,
    # the single_instance pump, and the cast/async leak cluster (cast
    # discovery loop threads, the SettingsDialog auto-probe, smart-playlist
    # preview dispatch). All isolated as of 2026-05-30.
    "pytest-randomly>=3.0",
    # Coverage signal (non-gating — no --cov-fail-under). See
    # [tool.coverage.run]; CI prints a term report but never fails on it.
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
    # Static type checking, advisory + scoped to jellytoast/providers (the
    # cleanest contract-bearing package). See [tool.mypy]. types-requests
    # gives the requests-driven provider code resolvable stubs.
    "mypy>=1.8",
    "types-requests",
    # Dependency / advisory scanning (advisory CI step). Surfaces known
    # CVEs in the resolved dependency set.
    "pip-audit>=2.7",
    # The runtime dep is Linux-gated (MPRIS), but the mpris unit tests force
    # IS_LINUX and import it on every platform — pure-python, so unconditional
    # here keeps `pip install -e .[dev]` + pytest green on the Win/Mac QA boxes.
    "dbus-next>=0.2.3",
]
# The DLNA / Sonos cast backends + the visualizer FFT dep are now
# bundled as REQUIRED dependencies (see [project.dependencies]) so every
# install ships the same backends — they're no longer opt-in extras.
# Per-platform extras. Windows stays empty (its winrt deps live in
# [project.dependencies] behind sys_platform markers). macOS carries pyobjc
# for the NowPlaying / Control Center backend and the future vibrancy bridge.
windows = []
# pyobjc powers the macOS native bits: media controls (MPNowPlayingInfoCenter +
# MPRemoteCommandCenter, surfaced in Control Center / on media keys) and the
# planned NSVisualEffectView vibrancy bridge. Kept as an EXTRA (not a hard
# darwin dependency) until those backends land — the autostart LaunchAgent
# backend that ships now is pure stdlib and needs none of this. Imports will be
# lazy + guarded so a missing install degrades to the no-op backend. Markers
# keep it a darwin-only resolve even when the extra is requested.
# (jellytoast/media_controls/_macos.py, jellytoast/blur/_macos.py — Mac-phase.)
macos = [
    'pyobjc-core>=10.0 ; sys_platform == "darwin"',
    'pyobjc-framework-Cocoa>=10.0 ; sys_platform == "darwin"',
    'pyobjc-framework-MediaPlayer>=10.0 ; sys_platform == "darwin"',
    # Real Notification Center banners (track-change / download-complete),
    # attributed to jellytoast — only fires in the bundled .app; falls back to
    # osascript from source. (jellytoast/notifications/_macos.py.)
    'pyobjc-framework-UserNotifications>=10.0 ; sys_platform == "darwin"',
    # SMAppService login-item autostart in the sandboxed Mac App Store build
    # (the .dmg uses a LaunchAgent; the sandbox forbids writing LaunchAgents).
    # jellytoast/autostart/_macos.py.
    'pyobjc-framework-ServiceManagement>=10.0 ; sys_platform == "darwin"',
]

# GUI entry point. `gui-scripts` (vs `scripts`) suppresses the console
# window on Windows; on Linux it behaves identically to `scripts`.
# packaging/aur/PKGBUILD invokes this entry point (authored + dry-run
# validated; AUR submission still pending).
[project.gui-scripts]
jellytoast = "jellytoast.app:main"

# Canonical project URLs — point at the real repo home,
# wolfgangwarehaus/jellytoast (matches the git `origin` remote). The
# GitHub account name is now finalized as `wolfgangwarehaus`, so the
# app-id is aligned to io.github.wolfgangwarehaus.jellytoast (it
# names the packaging/ metainfo + desktop files).
[project.urls]
Homepage = "https://github.com/wolfgangwarehaus/jellytoast"
Repository = "https://github.com/wolfgangwarehaus/jellytoast"
Issues = "https://github.com/wolfgangwarehaus/jellytoast/issues"
Changelog = "https://github.com/wolfgangwarehaus/jellytoast/blob/main/docs/CHANGELOG.md"

# Flat layout: everything (including the app entry, jellytoast/app.py)
# lives in the single `jellytoast` package tree, so the wheel ships ONE
# properly-namespaced top-level package — the old layout shipped a
# generic `modules` package that could collide in site-packages.
[tool.setuptools.packages.find]
include = ["jellytoast*"]
exclude = ["tests*", "docs*", "packaging*"]

[tool.setuptools.package-data]
# The drag-repaint KWin scripted effect ships as data files (JSON + JS)
# inside the jellytoast.drag_repaint package — installed into the user's
# KWin effects dir at runtime by jellytoast/drag_repaint/_kwin.py.
"jellytoast.drag_repaint" = [
    "effect/jellytoast_dragrepaint/metadata.json",
    "effect/jellytoast_dragrepaint/contents/code/main.js",
]
# The brand-mark SVG lives in-package so it ships in the built wheel —
# jellytoast/ui_helpers.make_app_icon() loads it via importlib.resources.
# (The packaging/icons/ copy stays for the freedesktop / hicolor system
# install, which is outside the wheel.)
"jellytoast.assets" = ["*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Quiet noisy DeprecationWarnings from PySide6 / requests during test runs;
# they're not regressions in our code.
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Captured one-shot platform diagnostic artifacts (mac vibrancy probes, etc.) —
# deliberately terse fragments kept for reference, not maintained tooling.
extend-exclude = ["dev/mac_test_artifacts"]

[tool.ruff.lint]
# Default ruleset is small + sane: pyflakes (F) catches real bugs,
# pycodestyle errors (E) catch the mechanical ones, isort (I) keeps
# import order deterministic + auto-fixable. flake8-bugbear (B) catches
# real-bug-class footguns (zip-without-strict, mutable/call defaults,
# blind-exception asserts). Style warnings (W) and formatting nits stay
# off — Black-style formatting is self-imposed, not enforced.
select = ["E", "F", "I", "B"]
ignore = [
    # Lazy module-level imports (after a helper function) are an
    # intentional pattern in a few modules. Real "imports buried mid-
    # function" should still be reviewed but ruff can't tell them
    # apart from the legitimate ones, so the rule's off globally.
    "E402",
    # Line-length nag; we wrap by editorial judgment.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# The MPRIS backend uses dbus-next's compact type-string annotations
# ("b" = bool, "s" = string, "as" = string array, "a{sv}" = dict).
# These look like syntax errors / undefined names to ruff but are
# the documented dbus-next API for declaring D-Bus property types.
"jellytoast/media_controls/_mpris.py" = ["F821", "F722"]
# B008 (function-call-in-default-argument): these four QAbstractListModel
# subclasses use `def rowCount(self, parent=QModelIndex())`, which is the
# canonical PySide6/Qt model-view override signature — QModelIndex() is an
# immutable invalid index (no shared-mutable-default footgun), and the
# overridden Qt slot signature is fixed, so it can't be hoisted into the
# body. Benign by Qt convention.
"jellytoast/genres_view.py" = ["B008"]
"jellytoast/library_grid.py" = ["B008"]
"jellytoast/np_track_list.py" = ["B008"]
"jellytoast/songs_view.py" = ["B008"]

# ── Static type checking (mypy) — ADVISORY, scoped ─────────────────────
# Non-strict baseline by design: PySide6 / pyatv / pychromecast / soco /
# async-upnp-client ship no type stubs, so `ignore_missing_imports` keeps
# the third-party noise out. The CI gate is scoped to jellytoast/providers
# (the cleanest contract-bearing package) and runs continue-on-error, so
# it surfaces drift without blocking. This is intentionally NOT --strict;
# tightening per-module is a future effort, not this task.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
# Don't crawl the whole tree on a bare `mypy` invocation; the gate
# explicitly passes `jellytoast/providers`.
files = ["jellytoast/providers"]

# ── Coverage (pytest-cov) — NON-GATING signal ─────────────────────────
# Measures jellytoast/ only (the package under test); the test files and the
# top-level launcher are excluded. There is deliberately NO
# --cov-fail-under threshold — coverage is a visibility signal printed in
# CI, not a gate.
[tool.coverage.run]
source = ["jellytoast"]
omit = [
    "tests/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
