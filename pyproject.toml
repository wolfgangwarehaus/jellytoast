# Project metadata for jellytoast.
#
# No [build-system] yet — the source layout (modules/ at the repo root)
# isn't pip-installable as-is. When we move to src/jellytoast/ later,
# add a setuptools build-system and project.scripts entry points.

[project]
name = "jellytoast"
version = "0.1.0"
description = "Audio-first native Jellyfin / Subsonic desktop client for Linux with bit-perfect mpv playback."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
authors = [
    { name = "august", email = "augustvontrips@gmail.com" },
]
keywords = ["jellyfin", "media", "music", "mpv", "linux", "kde"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Multimedia :: Video :: Display",
]

dependencies = [
    "PySide6>=6.6.0",
    "python-mpv>=1.0.5",
    "pychromecast>=14.0.0,<16",
    "zeroconf>=0.80.0",
    # dbus-next is a Linux-only feature dep (MPRIS / freedesktop). The
    # platform marker keeps `pip install` clean on Windows / macOS.
    'dbus-next>=0.2.3 ; sys_platform == "linux"',
    # pyatv (AirPlay 2) is broken on Windows — relies on asyncio +
    # low-level network primitives that don't ship there. macOS / Linux
    # only.
    'pyatv>=0.14.0 ; sys_platform != "win32"',
    "soco>=0.31,<1",
    "requests>=2.28.0",
    "keyring>=23.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]
# Visualizer FFT backend. Lazy-imported by modules/visualizer.py — the
# subsystem only spins up when JT_VISUALIZER=1, so numpy is opt-in to
# keep the default install (and the Flatpak bundle) lean.
visualizer = ["numpy>=1.24"]
# DLNA / UPnP-AV cast backend (modules/cast/dlna.py). Soft-imported via
# _ensure_async_upnp() so the module is safe to load without the dep
# installed; discovery short-circuits to "no DLNA renderers" when
# async-upnp-client is missing. Disabled by default in Settings
# (cast/dlna_enabled).
dlna = ["async-upnp-client>=0.47.0,<1.0"]
# Per-platform extras. Empty for now; populated when we add Windows
# (SMTC via winrt, autostart via registry) and macOS (NowPlaying /
# LaunchAgent via pyobjc) backends.
windows = []
macos = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Quiet noisy DeprecationWarnings from PySide6 / requests during test runs;
# they're not regressions in our code.
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Default ruleset is small + sane: pyflakes (F) catches real bugs,
# pycodestyle errors (E) catch the mechanical ones. Style warnings
# (W) and formatting nits stay off — Black-style formatting is
# self-imposed, not enforced.
select = ["E", "F"]
ignore = [
    # Lazy module-level imports (after a helper function) are an
    # intentional pattern in a few modules. Real "imports buried mid-
    # function" should still be reviewed but ruff can't tell them
    # apart from the legitimate ones, so the rule's off globally.
    "E402",
    # Line-length nag; we wrap by editorial judgment.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# The MPRIS backend uses dbus-next's compact type-string annotations
# ("b" = bool, "s" = string, "as" = string array, "a{sv}" = dict).
# These look like syntax errors / undefined names to ruff but are
# the documented dbus-next API for declaring D-Bus property types.
"modules/media_controls/_mpris.py" = ["F821", "F722"]
