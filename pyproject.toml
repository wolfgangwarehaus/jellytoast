# Project metadata for JellyToast.
#
# No [build-system] yet — the source layout (modules/ at the repo root)
# isn't pip-installable as-is. When we move to src/jellytoast/ later,
# add a setuptools build-system and project.scripts entry points.

[project]
name = "jellytoast"
version = "0.1.0"
description = "Audio-first Jellyfin desktop client for Linux, with embedded Jellyfin Web browsing and bit-perfect mpv playback."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
authors = [
    { name = "august", email = "augustvontrips@gmail.com" },
]
keywords = ["jellyfin", "media", "music", "mpv", "linux", "kde"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Multimedia :: Video :: Display",
]

dependencies = [
    "PySide6>=6.6.0",
    "python-mpv>=1.0.5",
    "pychromecast>=14.0.0",
    "zeroconf>=0.80.0",
    "dbus-next>=0.2.3",
    "requests>=2.28.0",
    "keyring>=23.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Quiet noisy DeprecationWarnings from PySide6 / requests during test runs;
# they're not regressions in our code.
filterwarnings = [
    "ignore::DeprecationWarning",
]
