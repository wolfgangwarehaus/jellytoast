# Release builds — runs on every v* tag and produces a DRAFT GitHub
# release holding all binary artifacts:
#   • jellytoast_<ver>_amd64.deb        (Ubuntu 22.04+/Debian 12+, self-contained)
#   • jellytoast-<ver>-x86_64.AppImage  (universal Linux, self-contained libmpv;
#                                        + .zsync for AppImageUpdate delta updates)
#   • jellytoast-<ver>-windows-x64-setup.exe   (Inno Setup installer, libmpv bundled)
#   • jellytoast-<ver>-windows-x64-portable.zip
#   • jellytoast-<ver>-macos-arm64.dmg  (Apple Silicon) + -macos-x86_64.dmg
#                                        (Intel) — native per-arch .app, libmpv
#                                        bundled; signed + notarized once the
#                                        Apple secrets exist
#   • sdist + wheel (PyPI-shaped, also attached)
#
# The release is created as a DRAFT — publishing (and the AUR/winget
# submissions that point at the tag) stays a human step.
#
# workflow_dispatch exists for dry runs: builds everything, uploads
# workflow artifacts, creates no release.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mas_action:
        description: "MAS build: validate only, or also upload to App Store Connect"
        type: choice
        options:
          - validate
          - upload
        default: validate

# Least-privilege default: only the draft-release job needs write (it
# mints the release); the build jobs run read-only so a compromised build
# step can't push to the repo.
permissions:
  contents: read

jobs:
  build-linux-deb:
    # Oldest supported LTS so the PyInstaller bundle's glibc floor stays
    # low (22.04 → works on 22.04+/Debian 12+).
    runs-on: ubuntu-22.04
    # id-token + attestations let this job mint a signed Sigstore build
    # provenance attestation for the .deb (free on public repos); contents
    # stays read so a compromised build step still can't push to the repo.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries (PySide6 headless + libmpv for analysis)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libmpv1
      - name: Build PyInstaller bundle
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          pyinstaller packaging/pyinstaller/jellytoast.spec --noconfirm
      - name: Frozen-bundle smoke test (imports + Qt offscreen boot probe)
        run: |
          test -x dist/jellytoast/jellytoast
          # Boot the frozen binary headless: an import/loader failure
          # dies in well under 10s with a real exit code; surviving to
          # the timeout (124) means Qt + the bundle initialized.
          QT_QPA_PLATFORM=offscreen timeout 10 dist/jellytoast/jellytoast || [ $? -eq 124 ]
      - name: Build .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_NAME}" = "${GITHUB_REF}" ] || true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          fi
          bash packaging/deb/build_deb.sh "$VERSION"
      # Install the real .deb in a NEWER Ubuntu than the 22.04 builder and
      # reproduce the BUG-1 (libmpv host-lib shadowing) + BUG-2 (libxcb-cursor0)
      # checks. The frozen smoke test above runs on 22.04 where the bundled libs
      # still match the host, so it can't catch these — this can.
      - name: Smoke-test the .deb across distros (BUG-1/BUG-2 regression guard)
        run: |
          # Cover the prior LTS, the newer LTS that actually surfaced BUG-1
          # (26.04), and Debian — the bundle's host-lib + Qt-plugin deps differ
          # across all three.
          for img in ubuntu:24.04 ubuntu:26.04 debian:stable; do
            echo "::group::smoke $img"
            docker run --rm -v "$PWD:/src:ro" "$img" bash /src/packaging/deb/smoke_test_deb.sh
            echo "::endgroup::"
          done
      - name: Lint the .deb (lintian, advisory)
        # Non-blocking, but DON'T swallow the exit code with `|| true` — that
        # would also hide the "step failed" annotation, leaving lint fully blind.
        # continue-on-error keeps the job green while still surfacing new tags.
        continue-on-error: true
        run: |
          sudo apt-get install -y lintian
          lintian --no-tag-display-limit dist/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb
      # Signed build provenance (Sigstore) — only for real tag releases,
      # not workflow_dispatch dry-runs. Verify with:
      #   gh attestation verify <file> --repo wolfgangwarehaus/jellytoast
      - name: Attest .deb provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.deb

  build-linux-appimage:
    # The universal-Linux channel: a self-contained AppImage that runs on any
    # glibc-compatible distro with no install/root. Matches the .deb's glibc
    # floor (ubuntu-22.04 / glibc 2.35) so it runs forward on every current
    # distro (Ubuntu 22.04+, Debian 12+, Fedora 36+, Arch, openSUSE…). AppImage
    # is forward-compatible only — built on the oldest base we support. (A 20.04
    # base would widen reach to Debian 11 / RHEL-8, but the hosted 20.04 runner
    # is retired; building inside an ubuntu:20.04 container is the documented
    # option — see the AppImage worklist in jellytoast-ops → packaging/appimage/.)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries to vendor (libmpv + FFmpeg + the Qt xcb closure)
        # build_appimage.sh vendors the ldd-closure of libmpv + the Qt xcb plugin
        # into the AppImage, so every lib it needs must be PRESENT here for ldd to
        # resolve it. This is the same closure the .deb declares as Depends.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev libegl1 libgl1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1 \
            libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libfreetype6
      - name: Build PyInstaller bundle
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          pyinstaller packaging/pyinstaller/jellytoast.spec --noconfirm
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build the AppImage
        run: bash packaging/appimage/build_appimage.sh "${{ steps.ver.outputs.version }}"
      # Prove self-containment: boot the AppImage in clean containers that have
      # NEITHER libmpv NOR the xcb closure installed. If a lib weren't bundled the
      # app aborts (rc != 124/0) — the exact gap that let a broken .deb ship.
      - name: Smoke-test the AppImage in clean containers (self-containment guard)
        run: |
          for img in ubuntu:24.04 debian:stable; do
            echo "::group::appimage smoke $img"
            docker run --rm -v "$PWD:/src:ro" "$img" bash /src/packaging/appimage/smoke_test_appimage.sh
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error
      # Separate entry so a missing .zsync fails loudly instead of shipping an
      # AppImage whose embedded update feed 404s (build_appimage.sh also gates).
      - uses: actions/upload-artifact@v7
        with:
          name: appimage-zsync
          path: dist/*.AppImage.zsync
          if-no-files-found: error
      - name: Attest AppImage provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.AppImage

  build-windows:
    runs-on: windows-latest
    # Azure Artifact Signing activates only once the secrets exist (see
    # jellytoast-ops → packaging/windows/azure-signing.md); until then SIGN='false' and both
    # signing steps below are skipped, so releases keep building unsigned.
    env:
      SIGN: ${{ secrets.AZURE_CLIENT_ID != '' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Stage pinned libmpv-2.dll
        run: pwsh packaging/windows/get_libmpv.ps1
      - name: Build PyInstaller bundle
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          pyinstaller packaging/pyinstaller/jellytoast.spec --noconfirm
      # Sign the frozen app (exe + bundled DLLs incl. libmpv-2.dll) BEFORE the
      # installer + portable zip are built, so every shipped binary is signed.
      # Skipped until the Azure secrets are configured.
      - name: Code-sign frozen bundle (Azure Artifact Signing)
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\jellytoast
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          } else {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build Inno Setup installer
        run: iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\windows\jellytoast.iss
      # Sign the installer itself (the bundle inside it was signed above).
      - name: Code-sign installer (Azure Artifact Signing)
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Build portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\jellytoast\* `
            -DestinationPath "dist\jellytoast-${{ steps.ver.outputs.version }}-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
      - name: Attest Windows artifact provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*-setup.exe
            dist/*-portable.zip

  build-macos:
    # Two NATIVE builds — Apple Silicon (arm64, macos-14) and Intel (x86_64,
    # macos-15-intel). Each does a native Homebrew-libmpv + PyInstaller build,
    # signs with Developer ID, notarizes, and ships its own
    # jellytoast-<ver>-macos-<arch>.dmg. fail-fast off so one arch failing
    # doesn't kill the other. (A single universal2 .dmg was ruled out: numpy +
    # cffi ship NO universal2 wheels, so PyInstaller's --target-arch universal2
    # aborts on the thin binaries — two native .dmgs are the reliable path.)
    #
    # `min` = the bundle's REAL macOS floor, dictated by the RUNNER OS: the
    # bundled Homebrew dylibs (libmpv + its FFmpeg/libass/libplacebo closure)
    # are built for the runner's macOS and dyld refuses to load them on anything
    # older — regardless of the Info.plist's LSMinimumSystemVersion. We stamp the
    # real floor into the plist (see "Pin the macOS floor") and the headless
    # smoke-test runs ON that floor, so a too-high floor can't ship silently.
    #
    # Floor = runner OS: Intel → Sequoia 15 (macos-15-intel), arm64 → Sonoma 14
    # (macos-14, the oldest free Apple-silicon image). We WANTED a lower Intel
    # floor (Ventura 13 via macos-13) but GitHub won't allocate macos-13 — jobs
    # queue indefinitely (hours, never picked up), so macos-15-intel is the only
    # viable Intel image (and the longer-lived one, ~to Aug 2027). Going below
    # Sequoia on Intel would mean building libmpv from source with a lower
    # MACOSX_DEPLOYMENT_TARGET on macos-15-intel (the finicky from-source path —
    # a follow-up if broader Intel reach is worth it). History: building Intel
    # here WITHOUT pinning the plist made a .dmg that claimed 12.0 but bounced-
    # and-died on Monterey (Sequoia dylibs, dyld refused them); the pin makes the
    # declared floor honest.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            min: "14.0"
          - runner: macos-15-intel
            arch: x86_64
            min: "15.0"
    runs-on: ${{ matrix.runner }}
    # Signing + notarization are gated on the Apple secrets, which are set —
    # releases ship a signed, notarized .dmg. The gate stays so a fork or a
    # secrets-less run still produces a local-testable unsigned build instead
    # of failing (see jellytoast-ops → packaging/macos/MACOS_SESSION.md).
    env:
      SIGN: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      NOTARIZE: ${{ secrets.APPLE_API_KEY_ID != '' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Stage libmpv (Homebrew) for the bundle
        run: bash packaging/macos/get_libmpv.sh
      - name: Build PyInstaller .app bundle
        # Match the C-extension deployment target to the runner's floor so any
        # source-built wheel agrees with the Homebrew dylibs' minimum.
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.min }}
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          pyinstaller packaging/pyinstaller/jellytoast.spec --noconfirm
      - name: Pin the macOS floor in the bundle's Info.plist
        # The spec ships a default LSMinimumSystemVersion; overwrite it with this
        # leg's REAL floor (the runner OS) so LaunchServices shows an honest
        # "needs macOS X" instead of a silent dock-bounce on older systems.
        run: |
          /usr/libexec/PlistBuddy -c \
            "Set :LSMinimumSystemVersion ${{ matrix.min }}" \
            dist/jellytoast.app/Contents/Info.plist
          echo "LSMinimumSystemVersion now: $(/usr/libexec/PlistBuddy -c \
            'Print :LSMinimumSystemVersion' dist/jellytoast.app/Contents/Info.plist)"
      # Import the Developer ID cert into a temporary keychain so codesign can
      # use it non-interactively. Skipped until the Apple secrets are set.
      - name: Import Developer ID certificate
        if: env.SIGN == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PWD: ${{ secrets.APPLE_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.APPLE_KEYCHAIN_PWD }}
        run: |
          CERT="$(mktemp)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import "$CERT" -f pkcs12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" build.keychain
          rm -f "$CERT"
      - name: Code-sign the .app (Developer ID, hardened runtime)
        if: env.SIGN == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash packaging/macos/sign_app.sh dist/jellytoast.app
      # Boot the frozen .app headless: an import/loader failure (e.g. libmpv
      # not bundled) dies fast with a real exit code; surviving 12s means Qt +
      # the bundle (incl. `import mpv`) initialized.
      - name: Smoke-test the .app (boots headless, import mpv OK)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          BIN=dist/jellytoast.app/Contents/MacOS/jellytoast
          test -x "$BIN"
          "$BIN" &
          PID=$!
          sleep 12
          if kill -0 "$PID" 2>/dev/null; then
            echo "still alive after 12s — Qt + bundle initialized OK"
            kill "$PID" 2>/dev/null || true
          else
            wait "$PID"; rc=$?
            echo "app exited early (rc=$rc) — likely an import/loader failure"
            exit 1
          fi
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build the .dmg
        run: bash packaging/macos/build_dmg.sh "${{ steps.ver.outputs.version }}" dist/jellytoast.app "${{ matrix.arch }}"
      # Notarize + staple the .dmg so Gatekeeper accepts it offline on first
      # launch. Skipped until the Apple API-key secrets are set.
      - name: Notarize + staple the .dmg
        if: env.NOTARIZE == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          KEY="$(mktemp /tmp/AuthKey_XXXXXX.p8)"
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$KEY"
          export APPLE_API_KEY_PATH="$KEY"
          bash packaging/macos/notarize.sh \
            "dist/jellytoast-${{ steps.ver.outputs.version }}-macos-${{ matrix.arch }}.dmg"
          rm -f "$KEY"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*-macos-${{ matrix.arch }}.dmg
      - name: Attest macOS artifact provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*-macos-${{ matrix.arch }}.dmg

  build-mas:
    # Mac App Store (sandboxed .pkg) build. Mirrors build-macos but with the
    # MAS-specific pieces: LGPL/no-Lua libmpv (the App Sandbox rejects the
    # GPL/LuaJIT one), Apple Distribution + Mac Installer certs (not Developer
    # ID), the MAS provisioning profile, inside-out SANDBOX signing,
    # productbuild -> .pkg, and `altool --validate-app` — the real go/no-go.
    #
    # Runs on every release tag (auto-uploads the signed .pkg to App Store Connect
    # so a build is always staged for submission) AND on workflow_dispatch
    # (validate-only by default; mas_action=upload to also upload). The slow
    # from-source libmpv build runs in parallel and does NOT gate the GitHub
    # release — draft-release doesn't `need` this job, so a MAS hiccup never blocks
    # the release. Everything past the symbol scan activates only when the MAS
    # secrets exist (they do). Setup: jellytoast-ops → packaging/macos/mas/MAS_SPIKE.md.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: macos-14
    timeout-minutes: 50  # productbuild can hang on a keychain prompt — fail fast, never burn the 6h default
    env:
      MAS_SIGN: ${{ secrets.MAS_PROVISION_PROFILE != '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build LGPL/no-Lua libmpv from source
        run: JT_LOG_STDOUT=1 LGPL_PREFIX=/tmp/lgpl bash packaging/macos/mas/build_libmpv_lgpl.sh
      - name: Build the sandboxed MAS .app (LGPL libmpv + itms-services patch)
        run: |
          python -m pip install --upgrade pip
          pip install '.[macos]' pyinstaller
          JT_LOG_STDOUT=1 JT_SRC="$PWD" LGPL_PREFIX=/tmp/lgpl \
            JT_PIP=pip JT_PYI=pyinstaller JT_PY=python3 \
            JT_DIST=dist JT_WORK=build \
            bash packaging/macos/mas/build_mas_app.sh
      - name: Non-public-API symbol scan (Qt / CPython / lzma)
        run: bash packaging/macos/mas/scan_symbols.sh dist/jellytoast.app
      # --- everything below activates only once the MAS secrets exist ---
      - name: Import the Apple Distribution cert (for the .app codesign)
        if: env.MAS_SIGN == 'true'
        env:
          APPLE_DIST_CERT: ${{ secrets.APPLE_DIST_CERT }}
          APPLE_DIST_CERT_PWD: ${{ secrets.APPLE_DIST_CERT_PWD }}
          KEYCHAIN_PWD: ${{ secrets.APPLE_KEYCHAIN_PWD }}
        run: |
          # Only the Apple Distribution cert needs the keychain now — for the
          # inside-out codesign of the .app. The .pkg is signed off-keychain by
          # rcodesign (next steps) straight from the installer .p12, so the Mac
          # Installer keychain import, the WWDR import, and the productbuild
          # keychain hardening are gone (they only ever served productbuild --sign,
          # which hung on the headless runner and is no longer used).
          KC=build.keychain
          security create-keychain -p "$KEYCHAIN_PWD" "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KC"
          DC="$(mktemp)"; echo "$APPLE_DIST_CERT" | base64 --decode > "$DC"
          security import "$DC" -f pkcs12 -k "$KC" -P "$APPLE_DIST_CERT_PWD" -T /usr/bin/codesign
          rm -f "$DC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KC"
      - name: Embed the MAS provisioning profile
        if: env.MAS_SIGN == 'true'
        env:
          MAS_PROVISION_PROFILE: ${{ secrets.MAS_PROVISION_PROFILE }}
        run: echo "$MAS_PROVISION_PROFILE" | base64 --decode > dist/jellytoast.app/Contents/embedded.provisionprofile
      - name: Sign inside-out (Apple Distribution + sandbox entitlements)
        if: env.MAS_SIGN == 'true'
        env:
          APPLE_DIST_IDENTITY: ${{ secrets.APPLE_DIST_IDENTITY }}
        run: bash packaging/macos/mas/sign_mas.sh dist/jellytoast.app
      - name: Resolve version
        id: ver
        run: |
          V="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build the installer .pkg (UNSIGNED — signed off-keychain below)
        if: env.MAS_SIGN == 'true'
        run: |
          # No --sign: productbuild --sign fires a non-interactive securityd prompt
          # that hangs forever on the headless runner (codesign is unaffected — the
          # .dmg job proves the runner is otherwise fine). Build unsigned (instant,
          # no keychain) and sign the xar wrapper with rcodesign in the next step.
          productbuild --component dist/jellytoast.app /Applications \
            "dist/jellytoast-${{ steps.ver.outputs.version }}-mas-unsigned.pkg"
      - name: Sign the .pkg off-keychain (rcodesign)
        if: env.MAS_SIGN == 'true'
        env:
          APPLE_INSTALLER_CERT: ${{ secrets.APPLE_INSTALLER_CERT }}
          APPLE_INSTALLER_CERT_PWD: ${{ secrets.APPLE_INSTALLER_CERT_PWD }}
        run: |
          # rcodesign signs the .pkg straight from the .p12 — it never touches the
          # keychain/securityd, so it cannot hit the prompt-hang that blocks
          # productbuild --sign forever on the GitHub macOS runner. Verified on the
          # rented Mac: pkgutil shows the full 3rd Party Mac Developer Installer ->
          # WWDR -> Apple Root chain on the resulting .pkg.
          RC=0.27.0
          # sha256-pinned: this binary is handed the Apple installer cert +
          # password, so a swapped release asset must fail loudly, not sign.
          RC_SHA256=163520079cd6ad1427791c792735a6ddfcb8eca0187bbcf0cc0bebfa4a62153d
          curl -fsSL -o /tmp/rc.tar.gz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RC}/apple-codesign-${RC}-aarch64-apple-darwin.tar.gz"
          echo "${RC_SHA256}  /tmp/rc.tar.gz" | shasum -a 256 -c -
          tar xzf /tmp/rc.tar.gz -C /tmp
          # Known path, not `find /tmp` — /tmp is a symlink to /private/tmp and BSD
          # find won't descend a symlink start point (returns nothing).
          RCB="/tmp/apple-codesign-${RC}-aarch64-apple-darwin/rcodesign"
          chmod +x "$RCB"; "$RCB" --version
          printf '%s' "$APPLE_INSTALLER_CERT" | base64 --decode > /tmp/installer.p12
          V="${{ steps.ver.outputs.version }}"
          "$RCB" sign --p12-file /tmp/installer.p12 --p12-password "$APPLE_INSTALLER_CERT_PWD" \
            "dist/jellytoast-${V}-mas-unsigned.pkg" "dist/jellytoast-${V}-mas.pkg"
          rm -f /tmp/installer.p12
          pkgutil --check-signature "dist/jellytoast-${V}-mas.pkg"
      - name: Validate the MAS .pkg (+ upload to App Store Connect if requested)
        if: env.MAS_SIGN == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_B64" | base64 --decode \
            > ~/".appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          PKG="dist/jellytoast-${{ steps.ver.outputs.version }}-mas.pkg"
          # ALWAYS validate (a fast CI gate). Upload to App Store Connect on a
          # release tag push (every release auto-stages a build for submission) or
          # when a manual dispatch asks (mas_action=upload); a plain dispatch stays
          # validate-only — a check, not a surprise upload.
          # NOTE: CFBundleVersion = GITHUB_RUN_NUMBER (see jellytoast.spec) —
          # monotonic per run, so re-running the same release tag re-uploads
          # cleanly under a fresh build number.
          xcrun altool --validate-app -t macos -f "$PKG" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.mas_action }}" = "upload" ]; then
            echo "release tag (or mas_action=upload) → uploading to App Store Connect"
            xcrun altool --upload-app -t macos -f "$PKG" \
              --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          else
            echo "manual validate-only run (mas_action='${{ github.event.inputs.mas_action }}') → skipping ASC upload"
          fi
          rm -f ~/".appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
      - uses: actions/upload-artifact@v7
        if: env.MAS_SIGN == 'true'
        with:
          name: mas
          path: dist/*-mas.pkg

  mas-submit:
    # ops#2 — Mac App Store parity with the Microsoft Store: after build-mas
    # uploads the .pkg, this job waits for Apple-side processing, creates the
    # appStoreVersion (releaseType AFTER_APPROVAL), sets the changelog-sourced
    # "What's New", attaches the build, and submits for review — hands-off.
    # Apple review (~1 day) is the only remaining human-time step; approval
    # then releases automatically. Runs ONLY on release tag pushes (a manual
    # validate/upload dispatch never auto-submits). Ubuntu runner on purpose:
    # the Apple processing wait is 5–30 min of polling — no reason to burn
    # 10x-priced macOS minutes on it. A failure here never un-ships anything:
    # the build is already uploaded, and a manual ASC submit stays possible.
    needs: build-mas
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Extract "What's new" from CHANGELOG (mac profile)
        run: |
          python3 dev/store_whats_new.py "${{ steps.ver.outputs.version }}" \
            --platform mac --out mas_whats_new.txt
          echo "## MAS What's new" >> "$GITHUB_STEP_SUMMARY"
          cat mas_whats_new.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for processing, create version, attach, submit
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          pip install --quiet pyjwt cryptography
          python3 dev/mas_submit.py \
            --version "${{ steps.ver.outputs.version }}" \
            --whats-new mas_whats_new.txt

  build-linux-flatpak:
    # Self-distributed .flatpak bundle (NOT a Flathub submission — see the
    # manifest header; Flathub's AI policy path is a separate, deliberate
    # future step). One file users install with
    # `flatpak install ./jellytoast-X.Y.Z.flatpak`; a self-hosted OSTree
    # repo for auto-updates is the planned follow-up.
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    timeout-minutes: 60  # ffmpeg + mpv build from source (~20 min, cached after)
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: flathub/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.wolfgangwarehaus.jellytoast.yml
          bundle: jellytoast-${{ steps.ver.outputs.version }}.flatpak
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}
          arch: x86_64
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: jellytoast-*.flatpak

  build-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
      - name: Attest sdist + wheel provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

  draft-release:
    if: github.event_name == 'push'
    needs: [build-linux-deb, build-linux-appimage, build-linux-flatpak, build-windows, build-macos, build-python]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job mints the release
    steps:
      # Checkout so we can lift the curated notes out of CHANGELOG.md.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum jellytoast* > SHA256SUMS
          cat SHA256SUMS
      # Lift the "## [<version>] — <date>" block out of the changelog (the
      # leading empty "## [Unreleased]" is skipped because we match the
      # exact version header). An optional "<!-- release-notes-end -->"
      # sentinel bounds the body: a first release whose section absorbed the
      # whole dev history still yields a curated release page (the full detail
      # stays in the file, below the sentinel). Falls back to GitHub's
      # auto-notes when the tag has no matching section (a -test/-rc tag).
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { grab = 0 }
            grab && /<!-- release-notes-end -->/ { grab = 0 }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          # Backstop: GitHub rejects release bodies over 125000 chars. If a
          # section is still huge (no sentinel), truncate well under the cap
          # and point at the full changelog so the release never fails to mint.
          if [ "$(wc -c < RELEASE_NOTES.md)" -gt 120000 ]; then
            # Truncate to a char boundary — decode(..., 'ignore') drops a split
            # trailing multibyte char so the body stays valid UTF-8 under the
            # cap (a raw byte cut could emit invalid UTF-8 and break the API).
            python3 -c "import pathlib;p=pathlib.Path('RELEASE_NOTES.md');p.write_text(p.read_bytes()[:120000].decode('utf-8','ignore'),encoding='utf-8')"
            printf '\n\n_…truncated — see the full changelog in docs/CHANGELOG.md._\n' >> RELEASE_NOTES.md
          fi
          if grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
            echo "Using curated notes from CHANGELOG.md:"; cat RELEASE_NOTES.md
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG section for $VERSION — falling back to --generate-notes."
          fi
      # Create the draft, or update it in place if it already exists — so a
      # re-run (GitHub "Re-run jobs") or a re-pushed tag never fails with
      # "release already exists". (The body-length 422 that bit v0.1.0's first
      # build is handled above by the sentinel + 120000-char backstop; this
      # removes the other way the job could fail to mint.)
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          TITLE="jellytoast $TAG"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating it in place (idempotent re-run)."
            if [ "${{ steps.notes.outputs.have_notes }}" = "true" ]; then
              gh release edit "$TAG" --repo "$REPO" --draft --title "$TITLE" --notes-file RELEASE_NOTES.md
            else
              gh release edit "$TAG" --repo "$REPO" --draft --title "$TITLE"
            fi
            gh release upload "$TAG" --repo "$REPO" --clobber artifacts/*
          elif [ "${{ steps.notes.outputs.have_notes }}" = "true" ]; then
            gh release create "$TAG" --repo "$REPO" --draft --title "$TITLE" \
              --notes-file RELEASE_NOTES.md artifacts/*
          else
            gh release create "$TAG" --repo "$REPO" --draft --title "$TITLE" \
              --generate-notes artifacts/*
          fi
