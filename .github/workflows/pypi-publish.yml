name: Publish to PyPI

# Publishes the sdist + wheel to PyPI via **Trusted Publishing (OIDC)** — there is
# NO API token to store or rotate; PyPI verifies this workflow's identity directly.
#
# Triggers:
#   - release: published  → auto-publishes when a GitHub release goes public
#     (the "publish" step of prepare → cut → build → publish; see CLAUDE.md).
#   - workflow_dispatch    → manual, for a given tag — used to backfill a release
#     that was published BEFORE this workflow existed (e.g. v0.1.2).
#
# One-time PyPI setup (the project already exists, so add a publisher to it):
#   https://pypi.org/manage/project/jellytoast/settings/publishing/  → Add a new
#   publisher → GitHub, with:
#     Owner:           wolfgangwarehaus
#     Repository name: jellytoast
#     Workflow name:   pypi-publish.yml
#     Environment name: pypi
#   These four must match the values below exactly or PyPI rejects the OIDC token.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build + publish (e.g. v0.1.2)"
        required: true

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jellytoast/
    permissions:
      contents: read
      id-token: write # mint the short-lived OIDC token Trusted Publishing needs
    steps:
      - uses: actions/checkout@v6
        with:
          # release event → the published tag; manual run → the tag input.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build + check sdist & wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent: a re-run (or a re-published release) won't fail on an
          # already-uploaded version — PyPI forbids overwriting a version anyway.
          skip-existing: true
