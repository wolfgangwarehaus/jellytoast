# Continuous integration for jellytoast.
#
# Backstops the manual wind-down gate (ruff clean + full suite green)
# so a tired-EOD push can't quietly regress main. Qt runs headless via
# the offscreen platform plugin — the same way the local self-test /
# smoke-test runs audio-null-sinked, so no display server is needed.
#
# Matrix-ready: when the Windows/macOS hardware arrives (TODO P4), add
# the OS to `matrix.os` to get CI coverage on code that can't be tested
# locally today.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PySide6 needs a handful of system libs to import even headless.
      - name: Install system Qt runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install project (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest, parallel)
        run: pytest -n auto -q
