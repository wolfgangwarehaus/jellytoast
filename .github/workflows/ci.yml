# Continuous integration for jellytoast.
#
# Backstops the manual wind-down gate (ruff clean + full suite green)
# so a tired-EOD push can't quietly regress main. Qt runs headless via
# the offscreen platform plugin — the same way the local self-test /
# smoke-test runs audio-null-sinked, so no display server is needed.
#
# Matrix-ready: when the Windows/macOS hardware arrives (TODO P4), add
# the OS to `matrix.os` to get CI coverage on code that can't be tested
# locally today.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Floor is 3.11 (pychromecast>=14 requires it — see pyproject
        # requires-python). 3.10 is intentionally not tested: it can't
        # install the deps.
        python-version: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # System libs: PySide6 needs the Qt/EGL/xkb set to import even
      # headless, and python-mpv's ctypes binding loads libmpv at import
      # time — without it, `import mpv` fails and jellytoast.player_backend
      # never binds the `mpv` attribute the bit-perfect tests monkeypatch.
      - name: Install system runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
          # libmpv's SONAME differs across Ubuntu releases (noble: libmpv2,
          # jammy: libmpv1) — install whichever the runner image carries.
          sudo apt-get install -y --no-install-recommends libmpv2 \
            || sudo apt-get install -y --no-install-recommends libmpv1

      # The cast/visualizer deps (numpy, async-upnp-client, soco,
      # snapcast) are part of the base install — the old per-protocol
      # extras were folded into [project.dependencies], so [dev] is the
      # only extra left and CI green == local green by construction.
      - name: Install project (with dev tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      # Static type check — ADVISORY, scoped to the cleanest contract-
      # bearing package. The baseline carries known errors today; this
      # surfaces drift without blocking. Tighten scope/strictness later.
      - name: Type check (mypy jellytoast/providers) [advisory]
        continue-on-error: true
        run: mypy jellytoast/providers

      - name: Test (pytest, parallel, coverage)
        # Coverage is a NON-GATING signal — term report only, no
        # --cov-fail-under threshold. Config in pyproject [tool.coverage].
        #
        # Retry-once on a flaky worker crash. `-n auto` + pytest-randomly
        # occasionally SIGSEGVs a single xdist worker during Qt/GC teardown
        # (a known isolation artifact — the "failed" test is a RANDOM
        # victim, not a real regression; see the test-isolation notes). The
        # retry reruns ONLY the failed tests, serially and with random
        # order off, so the crash victim passes in isolation — while a REAL
        # failure is deterministic and fails the retry too. Net: green stays
        # green, the flake self-heals, real breakage still blocks.
        run: |
          set +e
          pytest -n auto -q --cov=jellytoast --cov-report=term-missing
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          echo "::warning title=pytest retry::First pass exited $status. Retrying the failed tests serially with random order off to clear the known -n auto worker-crash flake. A real failure will fail this retry too."
          pytest --last-failed -p no:randomly -q

      # Dependency / advisory scan — ADVISORY. Surfaces known CVEs in the
      # resolved dependency set without failing the build.
      - name: Dependency audit (pip-audit) [advisory]
        continue-on-error: true
        run: pip-audit

  # Clean-room wheel build + install + import smoke. Closes the "do the
  # dependency caps actually resolve and does the built wheel import in a
  # fresh environment" check that the editable dev install can't catch.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # PySide6 / mpv runtime libs so the installed wheel can import.
      - name: Install system runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
          sudo apt-get install -y --no-install-recommends libmpv2 \
            || sudo apt-get install -y --no-install-recommends libmpv1

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # Catch PyPI metadata problems (README rendering, license, fields)
      # BEFORE the first upload — a version/filename can never be re-uploaded
      # to PyPI, so this is the cheapest possible guard on Phase 1.
      - name: twine check (PyPI metadata)
        run: python -m twine check dist/*

      - name: Install built wheel into a fresh venv and import
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --upgrade pip
          /tmp/wheel-venv/bin/pip install dist/*.whl
          # Import from /tmp so we exercise the INSTALLED package, not the
          # checkout's source tree.
          cd /tmp && /tmp/wheel-venv/bin/python -c "import jellytoast; import jellytoast.providers.base; print('wheel import OK:', jellytoast.__file__)"

  # Static validation of the distribution/packaging assets so they can't
  # silently rot as we build the per-channel release automation on top of
  # them (AppStream metainfo, the .desktop entry, the shell scripts, and
  # that the winget manifests still parse). Fast — no build needed.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream desktop-file-utils shellcheck
      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net packaging/io.github.wolfgangwarehaus.jellytoast.metainfo.xml
      - name: Validate the .desktop entry
        run: desktop-file-validate packaging/io.github.wolfgangwarehaus.jellytoast.desktop
      - name: Shellcheck packaging + release scripts
        run: |
          shellcheck packaging/deb/build_deb.sh packaging/install_icons.sh dev/cut_release.sh \
            packaging/macos/get_libmpv.sh packaging/macos/sign_app.sh \
            packaging/macos/build_dmg.sh packaging/macos/notarize.sh
      - name: winget manifests parse
        run: |
          python3 - <<'PY'
          import glob, yaml
          for f in sorted(glob.glob("packaging/winget/*.yaml")):
              yaml.safe_load(open(f)); print("YAML ok:", f)
          PY
