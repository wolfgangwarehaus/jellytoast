name: Deploy landing page

# Publishes site/ to GitHub Pages (wolfgangwarehaus.com/jellytoast — the
# apex is owned by the wolfgangwarehaus.github.io umbrella repo, so this
# project site is served under /jellytoast). Branch-deploy can't target a
# /site subfolder, so this uploads it as a Pages artifact.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
