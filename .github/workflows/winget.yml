name: winget

# Auto-submit the winget manifest update when a release is PUBLISHED — and a
# manual `workflow_dispatch` to submit (or re-submit / backfill) a specific tag.
# It runs on a PUBLISHED release (NOT the tag) because winget-releaser needs the
# installer asset to be publicly downloadable — a draft 404s its validation.
#
# ACTIVE — WINGET_TOKEN is set (classic PAT, `public_repo` scope; fine-grained
# PATs are unsupported) and auto-publishing has been live since 0.1.4. The
# secret gate below stays so a fork without the token skips the submit step
# cleanly instead of failing. The in-repo manifest is version-stamped by
# dev/cut_release.sh; see RELEASING.md in jellytoast-ops (private).

on:
  release:
    types: [released] # a non-prerelease publish only
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit (e.g. v0.1.3) — must be a PUBLISHED release"
        required: true

permissions:
  contents: read

jobs:
  winget:
    runs-on: ubuntu-latest
    env:
      HAVE_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - name: Submit version update to microsoft/winget-pkgs
        if: env.HAVE_TOKEN == 'true'
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: wolfgangwarehaus.jellytoast
          # Match ONLY the VERSIONED dual-arch Inno setup.exe — never the
          # portable .zips, and not the versionless/legacy alias copies
          # (jellytoast-windows-setup.exe, jellytoast-windows-x64-setup.exe)
          # the release also carries: byte-identical duplicates would make
          # winget see two installer URLs for one version.
          installers-regex: 'jellytoast-\d+\.\d+\.\d+-windows-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
          # On a release event this is the published tag; on workflow_dispatch it
          # is the input tag (so a release that published before the token existed
          # can be backfilled). The PackageVersion derives from it (minus `v`).
          release-tag: ${{ github.event.inputs.tag || github.event.release.tag_name }}
      - name: Dormant — WINGET_TOKEN not set
        if: env.HAVE_TOKEN != 'true'
        run: |
          echo "WINGET_TOKEN is not set → winget auto-submit is DORMANT (no-op)."
          echo "Activate: add a CLASSIC PAT (public_repo) as WINGET_TOKEN + fork"
          echo "microsoft/winget-pkgs under wolfgangwarehaus. See RELEASING.md in jellytoast-ops."
