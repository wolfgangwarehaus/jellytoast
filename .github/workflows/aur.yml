name: aur

# Publish the PKGBUILD to the AUR when a release is PUBLISHED (it bumps pkgver
# from the tag, regenerates .SRCINFO, refreshes the checksums via updpkgsums in
# an Arch container, and pushes to aur@aur.archlinux.org).
#
# DORMANT until BOTH: (a) the AUR reopens new-package registration (frozen after
# the 2026 malware wave) AND (b) you add the AUR_SSH_PRIVATE_KEY secret (a
# dedicated AUR deploy keypair; public half on your AUR account). See
# the RELEASING.md runbook (jellytoast-ops, private). Until then the steps are skipped.

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  aur:
    runs-on: ubuntu-latest
    env:
      HAVE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        if: env.HAVE_KEY == 'true'
      # NB: no pkgver stamp here — cut_release.sh already stamps PKGBUILD
      # pkgver/pkgrel at release-cut time and test_version_consistency.py gates
      # it in CI, so the committed PKGBUILD is the single source of truth.
      - name: Publish to the AUR
        if: env.HAVE_KEY == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: jellytoast
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: wolfgangwarehaus
          commit_email: august@wolfgangwarehaus.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: jellytoast ${{ github.event.release.tag_name }}
          updpkgsums: true
          ssh_keyscan_types: rsa,ecdsa,ed25519
      - name: Dormant — AUR_SSH_PRIVATE_KEY not set
        if: env.HAVE_KEY != 'true'
        run: |
          echo "AUR_SSH_PRIVATE_KEY is not set → AUR auto-deploy is DORMANT (no-op)."
          echo "(AUR new-package registration is also frozen.) See RELEASING.md in jellytoast-ops."
